# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      # BetterLET: runs use our API keys, so only the owner and collaborators get them.
      # The app names each run after its PR or issue ("Review #21 ..."); outside authors are skipped
      # unless a maintainer tagged @pullfrog on that PR or issue in the last 30 minutes.
      - name: Members only
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: ${{ inputs.name }}
          REPO: ${{ github.repository }}
        run: |
          num=$(printf '%s' "$RUN_NAME" | grep -oE '#[0-9]+' | head -n 1 | tr -d '#')
          if [ -z "$num" ]; then
            echo "No PR or issue number in the run name; running."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          assoc=$(gh api "repos/$REPO/issues/$num" --jq .author_association 2>/dev/null || echo UNKNOWN)
          case "$assoc" in
            OWNER|MEMBER|COLLABORATOR) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # Outside author: run only when the owner or a collaborator tagged @pullfrog in the last 30 minutes.
          tagged=$( {
            gh api "repos/$REPO/issues/$num/comments?per_page=100" 2>/dev/null || echo '[]'
            gh api "repos/$REPO/pulls/$num/comments?per_page=100" 2>/dev/null || echo '[]'
            gh api "repos/$REPO/pulls/$num/reviews?per_page=100" 2>/dev/null || echo '[]'
          } | jq -s '[ .[] | arrays | .[]
                | select((.author_association // "") | test("^(OWNER|MEMBER|COLLABORATOR)$"))
                | select((.body // "") | test("@pullfrog"; "i"))
                | select(((.created_at // .submitted_at // "1970-01-01T00:00:00Z") | fromdateiso8601) > (now - 1800))
              ] | length' )
          if [ "${tagged:-0}" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "#$num is by an outside author ($assoc), but a maintainer tagged @pullfrog; running."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: #$num is by an outside author ($assoc) and no maintainer tagged @pullfrog."
          fi
      - name: Checkout code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run agent
        if: steps.gate.outputs.run == 'true'
        uses: pullfrog/pullfrog@v0
        with:
          prompt: ${{ inputs.prompt }}
        env:
          # add at least one provider API key
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY:
            ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          
          # for Amazon Bedrock (https://docs.pullfrog.com/bedrock)
          # AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS_REGION: us-east-1
          # BEDROCK_MODEL_ID: <bedrock-model-id>
          
          # for Google Vertex AI (https://docs.pullfrog.com/vertex)
          # VERTEX_SERVICE_ACCOUNT_JSON: >-
          #   ${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON }}
          # GOOGLE_CLOUD_PROJECT: my-project
          # VERTEX_LOCATION: global
          # VERTEX_MODEL_ID: <vertex-model-id>

          # for Azure OpenAI (https://docs.pullfrog.com/azure)
          # AZURE_RESOURCE_NAME is the <name> in https://<name>.openai.azure.com
          # AZURE_DEPLOYMENT is your deployment's name, not the model it serves
          # AZURE_RESOURCE_NAME: my-resource
          # AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          # AZURE_DEPLOYMENT: <deployment-name>
          # both limits are required — set them to the real limits of that model
          # AZURE_CONTEXT: "400000"
          # AZURE_MAX_OUTPUT: "128000"

          # for any OpenAI-compatible endpoint — LiteLLM, Cloudflare AI Gateway,
          # self-hosted vLLM (https://docs.pullfrog.com/openai-compatible)
          # OPENAI_COMPATIBLE_BASE_URL: https://litellm.example.com/v1
          # OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          # OPENAI_COMPATIBLE_MODEL: <model-id>
          # both limits are required — set them to the real limits of that model
          # OPENAI_COMPATIBLE_CONTEXT: "128000"
          # OPENAI_COMPATIBLE_MAX_OUTPUT: "16384"
