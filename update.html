<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BetterLET update</title>
  <link rel="stylesheet" href="ext.css">
</head>
<body class="bl-page">
  <main>
    <header><img src="icons/icon48.png" alt="" width="32" height="32"><h1 id="title">BetterLET</h1></header>
    <p id="intro"></p>
    <section id="folder" hidden>
      <h2>Connect your BetterLET folder</h2>
      <p>Chrome does not tell extensions where they are stored, so you pick the folder one time. It is the folder you chose under Load unpacked. BetterLET checks that it is the right one, and it can only touch that folder.</p>
      <button type="button" id="pick">Choose folder</button>
    </section>
    <section id="update" hidden>
      <h2 id="update-title"></h2>
      <p class="muted" id="update-source"></p>
      <button type="button" id="install">Update now</button>
      <a id="zip" hidden>Download the zip instead</a>
    </section>
    <p id="status" role="status"></p>
    <iframe id="log" title="Changelog" src="https://betterlet.emd437509.workers.dev/?embed=1"></iframe>
  </main>
  <script src="updater.js"></script>
  <script src="update.js"></script>
</body>
</html>
